name: Daily CDN snapshot

on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно ~03:17 UTC
  workflow_dispatch: {}      # можно запустить вручную из вкладки Actions

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snapshot.json from CDN listing
        run: python3 scripts/snapshot.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- snapshot.json; then
            echo "Снимок без изменений — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          git commit -m "chore: обновить snapshot.json ($(date -u +%Y-%m-%d))"
          git push
